[colors]
; Catppuccin Mocha Palette
base = #1e1e2e
text = #cdd6f4
green = #a6e3a1
red = #f38ba8
blue = #89b4fa

[bar/main]
width = 100%
height = 32pt
radius = 0

background = ${colors.base}
foreground = ${colors.text}

border-bottom-size = 2pt
border-bottom-color = ${colors.blue}

; --- Padding & Spacing ---
padding-left = 1
padding-right = 1
module-margin = 2

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=15;4"

; --- Layout Change ---
modules-left = xworkspaces awesomelayout
modules-center = xwindow
modules-right = network pulseaudio powerprofile battery date

; This allows Polybar to receive click events properly in AwesomeWM
override-redirect = false
wm-restack = generic

; This ensures the bar doesn't capture the mouse where it shouldn't
enable-ipc = true

; Add this to prevent the "hover center" issue
cursor-click = pointer
cursor-scroll = ns-resize

[module/xwindow]
type = internal/xwindow
; Limit the title length so it doesn't push into your right-side modules
label = %title:0:40:...% 
label-foreground = ${colors.blue}
label-padding = 2
; Add this to ensure it stays centered and doesn't expand
label-alignment = center

[module/network]
type = custom/script
exec = ~/.config/polybar/network.sh
interval = 2
format = <label>
label = %output%

; Click logic we discussed
click-left = if [ -f /tmp/polybar_net_state ]; then rm /tmp/polybar_net_state; else touch /tmp/polybar_net_state; fi
click-right = nm-connection-editor &

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.blue}
label-active-foreground = ${colors.base}
label-active-padding = 1

[module/powerprofile]
type = custom/script
; Read the hardware profile and format the text
exec = cat /sys/firmware/acpi/platform_profile 2>/dev/null | sed -e 's/low-power/Power-Saver/' -e 's/balanced/Balanced/' -e 's/performance/Performance/' || echo "Standard"
interval = 3

format-prefix = "󰓅 "
format-prefix-foreground = ${colors.blue}
label = %output%
label-padding = 1

; Left click to cycle through the TLP profiles seamlessly
click-left = current=$(cat /sys/firmware/acpi/platform_profile 2>/dev/null); if [ "$current" = "performance" ]; then sudo tlp balanced; elif [ "$current" = "balanced" ]; then sudo tlp power-saver; else sudo tlp performance; fi

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT0
adapter = AC

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>

label-charging = %percentage%%
label-discharging = %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.blue}

animation-charging-0 = 󰂄
animation-charging-foreground = ${colors.green}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume>  <label-volume>
label-volume = %percentage%%

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

label-muted = 󰝟  muted
label-muted-foreground = ${colors.red}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.blue}

[module/awesomelayout]
type = custom/script
exec = tail -F /tmp/awesome_layout 2>/dev/null
tail = true

format = <label>
label = %output%
; Removed label-foreground here because we are setting colors directly in Lua now
label-padding = 1

click-left = awesome-client 'require("awful").layout.inc(1)'
click-right = awesome-client 'require("awful").layout.inc(-1)'
